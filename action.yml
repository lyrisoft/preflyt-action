name: Preflyt policy check
description: Run the checks in a reviewed Preflyt policy and return results automatically through GitHub.
author: Lyrisoft
branding:
  icon: shield
  color: blue
inputs:
  api-url:
    description: Public HTTPS Preflyt API URL (including its API prefix, if configured).
    required: true
  mode:
    description: check runs policy checks; gate waits for verified check jobs, configured AI reviews and PR publication in the same workflow.
    required: false
    default: check
  source-run:
    description: Optional source run ID. Defaults to the current workflow run.
    required: false
  source-attempt:
    description: Optional source attempt. Defaults to the current workflow attempt.
    required: false
  job-name:
    description: Check job display name when it differs from its YAML ID. Defaults to the current job ID.
    required: false
  proofs:
    description: Optional JSON mapping report paths to existing signed proof bundle paths.
    required: false
    default: '{}'
  coverage-reports:
    description: Optional JSON array of current-run LCOV paths and repository package prefixes.
    required: false
    default: '[]'
  coverage-artifact:
    description: Optional API coverage artifact from this same workflow run and attempt.
    required: false
    default: ''
  github-token:
    description: Read-only Actions token used only to retrieve the coverage artifact.
    required: false
    default: ${{ github.token }}
outputs:
  result:
    description: passed, failed, or incomplete
    value: ${{ steps.execute.outputs.result }}
runs:
  using: composite
  steps:
    - name: Validate Action mode
      shell: bash
      env:
        PREFLYT_MODE: ${{ inputs.mode }}
      run: |
        if [ "$PREFLYT_MODE" != "check" ] && [ "$PREFLYT_MODE" != "gate" ]; then
          echo "::error::Preflyt mode must be check or gate."
          exit 1
        fi
    - name: Fetch published PR policy
      if: ${{ inputs.mode == 'check' }}
      id: policy
      shell: bash
      env:
        PREFLYT_ACTION_PATH: ${{ github.action_path }}
        PREFLYT_API_URL: ${{ inputs.api-url }}
      run: python3 "$PREFLYT_ACTION_PATH/transport.py" fetch
    - name: Run policy checks
      if: ${{ inputs.mode == 'check' }}
      id: execute
      shell: bash
      env:
        PREFLYT_ACTION_PATH: ${{ github.action_path }}
        PREFLYT_POLICY_PATH: ${{ steps.policy.outputs.policy }}
        PREFLYT_PROOFS: ${{ inputs.proofs }}
        PREFLYT_JOB_NAME: ${{ inputs.job-name || github.job }}
      run: |
        echo "coverage-since=$(date +%s)" >> "$GITHUB_OUTPUT"
        python3 "$PREFLYT_ACTION_PATH/run.py"
    - name: Locate current API coverage artifact
      id: coverage-artifact
      if: ${{ inputs.mode == 'check' && steps.execute.outputs.result == 'passed' && inputs.coverage-artifact != '' }}
      shell: bash
      env:
        PREFLYT_ACTION_PATH: ${{ github.action_path }}
        PREFLYT_COVERAGE_ARTIFACT: ${{ inputs.coverage-artifact }}
        PREFLYT_COVERAGE_TOKEN: ${{ inputs.github-token }}
      run: python3 "$PREFLYT_ACTION_PATH/coverage.py" wait
    - name: Download current API coverage
      id: coverage-download
      if: ${{ steps.coverage-artifact.outputs.artifact-id != '' }}
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        artifact-ids: ${{ steps.coverage-artifact.outputs.artifact-id }}
        path: ${{ runner.temp }}/preflyt-coverage-${{ github.run_id }}-${{ github.run_attempt }}
        merge-multiple: true
        github-token: ${{ inputs.github-token }}
    - name: Attach current test coverage
      if: ${{ always() && inputs.mode == 'check' && steps.execute.outputs.result == 'passed' && (inputs.coverage-reports != '[]' || inputs.coverage-artifact != '') }}
      shell: bash
      env:
        PREFLYT_ACTION_PATH: ${{ github.action_path }}
        PREFLYT_BUNDLE_PATH: ${{ steps.execute.outputs.bundle }}
        PREFLYT_COVERAGE_REPORTS: ${{ inputs.coverage-reports }}
        PREFLYT_COVERAGE_SINCE: ${{ steps.execute.outputs.coverage-since }}
        PREFLYT_COVERAGE_DIRECTORY: ${{ inputs.coverage-artifact != '' && steps.coverage-download.outputs.download-path || '' }}
        PREFLYT_COVERAGE_ARTIFACT_REQUIRED: ${{ inputs.coverage-artifact != '' }}
      run: python3 "$PREFLYT_ACTION_PATH/coverage.py" attach
    - name: Send results to Preflyt
      if: ${{ always() && inputs.mode == 'check' && steps.execute.outputs.bundle != '' }}
      shell: bash
      env:
        PREFLYT_ACTION_PATH: ${{ github.action_path }}
        PREFLYT_API_URL: ${{ inputs.api-url }}
        PREFLYT_BUNDLE_PATH: ${{ steps.execute.outputs.bundle }}
      run: python3 "$PREFLYT_ACTION_PATH/transport.py" submit
    - name: Record policy result
      if: ${{ always() && inputs.mode == 'check' }}
      shell: bash
      env:
        PREFLYT_RESULT: ${{ steps.execute.outputs.result }}
      run: |
        case "$PREFLYT_RESULT" in
          passed|failed|incomplete)
            echo "Policy result: $PREFLYT_RESULT. The Preflyt final gate enforces the verified policy."
            ;;
          *) echo "::error::Policy execution did not produce a result."; exit 1 ;;
        esac
    - name: Wait for verified Preflyt publication
      if: ${{ inputs.mode == 'gate' }}
      shell: bash
      env:
        PREFLYT_ACTION_PATH: ${{ github.action_path }}
        PREFLYT_API_URL: ${{ inputs.api-url }}
        PREFLYT_SOURCE_RUN_ID: ${{ inputs.source-run || github.run_id }}
        PREFLYT_SOURCE_RUN_ATTEMPT: ${{ inputs.source-attempt || github.run_attempt }}
      run: python3 "$PREFLYT_ACTION_PATH/transport.py" gate
