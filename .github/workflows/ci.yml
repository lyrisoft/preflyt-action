name: Action tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test runner and publication transport
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Compile Action modules
        run: python3 -m py_compile run.py recipes.py transport.py
